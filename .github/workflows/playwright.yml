name: Browser smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: SYNTHETIC_DEMO_ENABLED=true docker compose up --build -d
      - run: docker compose -f compose.yaml -f compose.e2e.yaml run --rm e2e uv run pytest tests/e2e/test_foundation_smoke.py tests/e2e/test_marketing_smoke.py tests/e2e/test_portfolio_workflow_smoke.py tests/e2e/test_responsive_ui_smoke.py -q
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-output
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose down --volumes
