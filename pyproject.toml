[project]
name = "takdora"
version = "0.1.0"
description = "A configurable booking and invoice hub for Philippine service businesses."
requires-python = ">=3.13"
dependencies = [
  "reflex[db]>=0.8.0,<0.9.0",
  "psycopg[binary]>=3.2,<4.0",
  "sentry-sdk>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "pip-audit>=2.8,<3.0",
  "playwright>=1.50,<2.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["takdora"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
