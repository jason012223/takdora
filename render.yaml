services:
  - type: web
    name: takdora
    runtime: docker
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: BACKEND_PATH
        value: /api
      - key: DATABASE_URL
        fromDatabase:
          name: takdora-postgres
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: API_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: takdora-postgres
    databaseName: takdora
    user: takdora
    plan: basic-256mb
    region: singapore
